name: Visual Layer
description: Visual Layer is an AI-powered platform for managing, curating, and enriching large-scale
  unstructured visual data (images and video) at scales from gigabytes to petabytes. Its cloud and
  self-hosted products let teams organize, explore, deduplicate, quality-check, and semantically search
  visual datasets, then enrich them with vision AI models that generate captions, detect objects, and
  build embeddings for search. Visual Layer exposes a REST API — JWT-authenticated for the cloud,
  unauthenticated for on-premises — covering dataset creation from S3 or local files, visual and semantic
  search, enrichment, export, saved views with monitoring and alerting, snapshots, and task management.
  The company also maintains the popular open-source fastdup tool, is backed by Insight Partners, and was
  acquired by Camtek in 2025.
